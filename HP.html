<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーム - Masa のページ</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark-navy: #1A2332;
      --navy: #2C3E50;
      --teal: #16A085;
      --light-gray: #ECF0F1;
      --white: #FFFFFF;
      --text-dark: #2C3E50;
      --text-light: #7F8C8D;
      --accent: #2980B9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--white);
      color: var(--text-dark);
      font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.8;
      font-weight: 400;
    }

    h1, h2, h3 {
      font-family: 'Shippori Mincho', 'Georgia', serif;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== ヒーロー/ヘッダー ===== */
    .header {
      background: linear-gradient(135deg, var(--dark-navy) 0%, var(--navy) 100%);
      color: var(--white);
      padding: 80px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(22, 160, 133, 0.1);
      z-index: 0;
    }

    .header-content {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
    }

    .header h1 {
      font-size: 42px;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    /* ===== メインコンテンツ ===== */
    .main-content {
      flex: 1;
      padding: 60px 24px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      margin-bottom: 60px;
    }

    .category-block {
      background: var(--white);
      border-left: 4px solid var(--teal);
      padding: 40px;
      box-shadow: 0 4px 12px rgba(44, 62, 80, 0.08);
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .category-block:hover {
      box-shadow: 0 8px 20px rgba(44, 62, 80, 0.12);
      transform: translateY(-2px);
    }

    .category-title {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      font-weight: 700;
      color: var(--dark-navy);
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--light-gray);
    }

    .category-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--white);
    }

    .category-block:nth-child(1) .category-icon {
      background: linear-gradient(135deg, #2980B9, #3498DB);
    }

    .category-block:nth-child(2) .category-icon {
      background: linear-gradient(135deg, #E74C3C, #F39C12);
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: var(--light-gray);
      border: 2px solid transparent;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-dark);
      transition: all 0.25s ease;
      font-size: 18px;
      font-weight: 500;
    }

    .link-item:hover {
      background: var(--accent);
      color: var(--white);
      transform: translateX(8px);
      border-color: var(--accent);
    }

    .link-item:active {
      transform: translateX(6px);
    }

    .link-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.9;
      font-size: 16px;
    }

    .link-item:hover .link-icon {
      opacity: 1;
    }

    .link-text {
      flex: 1;
      font-size: 18px;
      font-weight: 500;
    }

    .link-arrow {
      font-size: 18px;
      flex-shrink: 0;
      opacity: 0.5;
      transition: all 0.2s ease;
    }

    .link-item:hover .link-arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    /* ===== 階層リンク用スタイル ===== */
    .link-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .parent-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: var(--light-gray);
      border: 2px solid transparent;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-dark);
      transition: all 0.25s ease;
      font-size: 18px;
      font-weight: 600;
      cursor: default;
    }

    .parent-link:hover {
      transform: none;
    }

    .parent-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: linear-gradient(135deg, #8E44AD, #9B59B6);
      color: var(--white);
      font-size: 16px;
      font-weight: 600;
    }

    .child-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px 16px 48px;
      background: #F8FAFB;
      border-left: 3px solid var(--teal);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-dark);
      transition: all 0.25s ease;
      font-size: 17px;
      font-weight: 500;
      margin-left: 8px;
    }

    .child-link:hover {
      background: var(--accent);
      color: var(--white);
      transform: translateX(6px);
    }

    .child-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--teal);
      color: var(--white);
      font-size: 14px;
    }

    .child-link:hover .child-icon {
      background: var(--white);
      color: var(--accent);
    }

    /* ===== 非アクティブリンク ===== */
    .link-item.inactive {
      opacity: 0.6;
      cursor: default;
      pointer-events: none;
    }

    /* ===== フッター ===== */
    .footer {
      background: var(--light-gray);
      text-align: center;
      padding: 40px 24px;
      margin-top: auto;
      font-size: 13px;
      color: var(--text-light);
      border-top: 1px solid #DDD;
    }

    .footer p {
      margin: 0;
    }

    /* ===== レスポンシブ ===== */
    @media (max-width: 768px) {
      .header {
        padding: 60px 20px;
      }

      .header h1 {
        font-size: 32px;
      }

      .header p {
        font-size: 15px;
      }

      .main-content {
        padding: 40px 16px;
      }

      .categories {
        gap: 28px;
      }

      .category-block {
        padding: 28px;
      }

      .category-title {
        font-size: 24px;
        margin-bottom: 20px;
      }

      .link-item {
        padding: 16px 20px;
        font-size: 16px;
      }

      .link-text {
        font-size: 16px;
      }

      .parent-link {
        padding: 16px 20px;
        font-size: 16px;
      }

      .child-link {
        padding: 14px 20px 14px 44px;
        font-size: 15px;
      }
    }

    @media (max-width: 480px) {
      .header {
        padding: 50px 16px;
      }

      .header h1 {
        font-size: 26px;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 14px;
      }

      .main-content {
        padding: 30px 14px;
      }

      .categories {
        gap: 20px;
      }

      .category-block {
        padding: 20px;
        border-left-width: 3px;
      }

      .category-title {
        font-size: 20px;
        gap: 10px;
      }

      .category-icon {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }

      .link-item {
        padding: 14px 16px;
        gap: 12px;
        font-size: 15px;
      }

      .link-icon {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .link-text {
        font-size: 15px;
      }

      .parent-link {
        padding: 14px 16px;
        font-size: 15px;
      }

      .child-link {
        padding: 12px 16px 12px 40px;
        font-size: 14px;
      }

      .footer {
        padding: 30px 16px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="header-content">
        <h1>Information Portal</h1>
        <p>ym-mieli's GitHub</p>
      </div>
    </div>

    <div class="main-content">
    <div class="categories">
      <!-- 仕事カテゴリ -->
      <div class="category-block">
        <h2 class="category-title">
          <div class="category-icon">W</div>
          <span>Work</span>
        </h2>
        <div class="links-list">
          <!-- H19年度 杭基礎設計便覧 -->
          <div class="link-group">
            <div class="parent-link">
              <div class="parent-icon">📋</div>
              <span class="link-text">H19年度 杭基礎設計便覧</span>
            </div>
            <a href="https://ym-mieli.github.io/civil-eng/pile-chart.html" class="child-link">
              <div class="child-icon">▢</div>
              <span class="link-text">杭基礎の概要と選定表</span>
              <span class="link-arrow">→</span>
            </a>
          </div>

          <div class="link-item inactive">
            <div style="width: 32px; height: 32px; border-radius: 50%; background: #BDC3C7; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px;">−</div>
            <span class="link-text">基準書2</span>
            <span class="link-arrow">準備中</span>
          </div>
          <div class="link-item inactive">
            <div style="width: 32px; height: 32px; border-radius: 50%; background: #BDC3C7; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px;">−</div>
            <span class="link-text">基準書3</span>
            <span class="link-arrow">準備中</span>
          </div>
        </div>
      </div>

      <!-- 育児カテゴリ -->
      <div class="category-block">
        <h2 class="category-title">
          <div class="category-icon">R</div>
          <span>Raising</span>
        </h2>
        <div class="links-list">
          <a href="https://ym-mieli.github.io/ym.io/sukusuku-list2.html" class="link-item">
            <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #E74C3C, #F39C12); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px;">✓</div>
            <span class="link-text">sukusuku-list</span>
            <span class="link-arrow">→</span>
          </a>
        </div>
      </div>
    </div>
    </div>

    <div class="footer">
      <p>© 2026 Masa. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
