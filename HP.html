  <style>
    :root {
      --ink: #1C1C1E;
      --ink-soft: #4A4A4E;
      --muted: #9A9AA0;
      --line: #E4E4E7;
      --line-soft: #EEEEF0;
      --paper: #FFFFFF;
      --accent: #16506B;
      --accent-soft: #EDF3F5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
    }

    h1, h2 {
      font-family: 'Shippori Mincho', 'Georgia', serif;
      font-weight: 600;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== ヘッダー ===== */
    .header {
      padding: 72px 0 56px;
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .header-logo {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .header-text p {
      font-size: 12.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    /* ===== メインコンテンツ ===== */
    .main-content {
      flex: 1;
      max-width: 880px;
      margin: 0 auto;
      padding: 64px 40px 100px;
      width: 100%;
    }

    .category-block {
      margin-bottom: 72px;
    }

    .category-block:last-child {
      margin-bottom: 0;
    }

    .category-title {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 32px;
    }

    .category-index {
      font-family: 'Shippori Mincho', serif;
      font-size: 15px;
      color: var(--accent);
      letter-spacing: 1px;
      border: 1px solid var(--accent);
      padding: 3px 10px;
      border-radius: 2px;
      font-weight: 600;
    }

    .category-title span {
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.5px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 4px;
      border-bottom: 1px solid var(--line-soft);
      text-decoration: none;
      color: var(--ink);
      transition: all 0.2s ease;
    }

    .link-item:first-child {
      border-top: 1px solid var(--line-soft);
    }

    .link-item:hover {
      background: var(--accent-soft);
      padding-left: 16px;
      padding-right: 16px;
    }

    .link-item:hover .link-text {
      color: var(--accent);
    }

    .link-item:hover .link-arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    .link-text {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .link-arrow {
      font-size: 15px;
      color: var(--accent);
      opacity: 0;
      transition: all 0.2s ease;
    }

    /* ===== 親子リンク ===== */
    .link-group {
      border-bottom: 1px solid var(--line-soft);
    }

    .link-group:first-child {
      border-top: 1px solid var(--line-soft);
    }

    .parent-link {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 4px 12px;
      cursor: default;
    }

    .parent-link .link-text {
      font-weight: 600;
      color: var(--ink);
    }

    .child-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 4px 20px 40px;
      text-decoration: none;
      color: var(--ink-soft);
      transition: all 0.2s ease;
      position: relative;
    }

    .child-link::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 0;
      bottom: 20px;
      width: 1px;
      background: var(--line);
    }

    .child-link::after {
      content: '';
      position: absolute;
      left: 12px;
      top: calc(50% - 10px);
      width: 16px;
      height: 1px;
      background: var(--line);
    }

    .child-link:hover {
      background: var(--accent-soft);
      padding-left: 44px;
    }

    .child-link:hover .link-text {
      color: var(--accent);
    }

    .child-link:hover .link-arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    .child-link .link-text {
      font-size: 15px;
      font-weight: 400;
    }

    .marker {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker svg {
      width: 100%;
      height: 100%;
    }

    /* ===== 非アクティブ ===== */
    .link-item.inactive {
      cursor: default;
      color: var(--muted);
    }

    .link-item.inactive:hover {
      background: none;
      padding-left: 4px;
      padding-right: 4px;
    }

    .link-item.inactive .link-text {
      color: var(--muted);
    }

    .badge {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 2px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ===== フッター ===== */
    .footer {
      text-align: center;
      padding: 32px 24px;
      font-size: 11.5px;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
  </style>
</head>
